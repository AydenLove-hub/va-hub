<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Hub</title>
<!-- Paste the Apps Script Web app URL between the quotes below (Deploy → Manage deployments → Web app URL). -->
<meta name="vahub-connection" content="https://script.google.com/a/macros/loveswindowwashing.com/s/AKfycbws78wzV_T52qtSLhJ_OBKBEELhndH_xg0ZdngFSaAFb4TvrOIS8RQgD9G1a-zUu3jD/exec">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VA Hub">
<meta name="theme-color" content="#792c18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rakkas&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  /* Loves Window Washing brand (loveswindowwashing.com) */
  --ink:#1b1b1b; --cream:#faedd2; --cream-deep:#f1dfba; --brand-red:#792c18; --red-deep:#5e2010; --red-bright:#9a3a1f;
  --gold:#c98a2e; --gold-light:#edc989; --line:#1b1b1b;
  --font-display:"Rakkas","Sansita",Georgia,serif; --font-script:"Yellowtail",cursive;
  --bg:#faedd2; --surface:#fffaf0; --surface-2:#f5e5c3; --border:#e6d1a7; --border-strong:#c4a97f;
  --text:#1b1b1b; --muted:#6a5743; --faint:#9a8670;
  --accent:#792c18; --accent-hover:#5e2010; --accent-soft:#f6dccd; --accent-ink:#faedd2;
  --green:#792c18; --green-soft:#f1dcae; --amber:#8a3d10; --amber-soft:#f6d2b5; --red:#b3261e; --red-soft:#fbded5;
  --fill:#f6db9b; --fill-ink:#5a3a00;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 0 rgba(94,32,16,.04),0 2px 6px rgba(94,32,16,.07);
  --shadow-lg:0 18px 44px rgba(46,20,8,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17110d; --surface:#211813; --surface-2:#2c2019; --border:#3b2b21; --border-strong:#5a4232; --line:#6b4f3c;
    --text:#faedd2; --muted:#cdb99a; --faint:#9c8a74;
    --accent:#edc989; --accent-hover:#f4d9a8; --accent-soft:#3d2f19; --accent-ink:#1b1b1b;
    --green:#edc989; --green-soft:#3d2f19; --amber:#f2a774; --amber-soft:#43281a; --red:#ff9a82; --red-soft:#4a2419;
    --fill:#5c4815; --fill-ink:#ffe3a0;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.spacer{flex:1}
h2{font-size:16px;margin:0;font-weight:650;letter-spacing:-.005em}
h3{font-size:14px;margin:0;font-weight:600}
mark{background:var(--fill);color:inherit;border-radius:3px;padding:0 1px}

/* Header */
.app-header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hdr{max-width:1160px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand-text{min-width:0}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.015em}
.brand .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whoami{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.whoami .who-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:600;line-height:18px;text-align:center}
.tab .count.hot{background:var(--red);color:#fff}
@media (max-width:520px){.whoami .who-name{display:none}main{padding:16px 14px 50px!important}.hdr{padding:12px 14px 0}}

main{max-width:1160px;margin:0 auto;padding:20px 20px 60px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
@media (max-width:860px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .right{margin-left:auto}
.page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-title h2{font-size:22px;letter-spacing:-.02em}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{filter:brightness(1.06);background:var(--green)}
.btn-amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.btn-amber:hover{filter:brightness(.97);background:var(--amber-soft)}
.btn-danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent);background:transparent}
.btn-danger:hover{background:var(--red-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:16px;border-radius:12px}
.icon-btn{appearance:none;border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Pills & badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-in{background:var(--green-soft);color:var(--green)}
.pill-in .dot{animation:pulse 1.8s ease-in-out infinite}
.pill-break{background:var(--amber-soft);color:var(--amber)}
.pill-out{background:var(--surface-2);color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-blue{background:var(--accent-soft);color:var(--accent)}
.badge-fill{background:var(--fill);color:var(--fill-ink)}

/* Avatars */
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.av-lg{width:38px;height:38px;font-size:14px}
.av-sm{width:20px;height:20px;font-size:9.5px}

/* Banners */
.banner{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner.err{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.banner .b-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ann{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:12px}
.ann .ann-icon{font-size:20px;line-height:1.2}
.ann .ann-body{flex:1;min-width:0;white-space:pre-wrap;font-size:14.5px}
.ann .ann-meta{font-size:12px;color:var(--muted);margin-top:4px;white-space:normal}

/* Clock */
.clock-card{position:relative;overflow:hidden}
.clock-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--border)}
.clock-card.st-in::before{background:var(--green)}
.clock-card.st-break::before{background:var(--amber)}
.clock-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big-timer{font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:14px 0 4px}
@media (max-width:520px){.big-timer{font-size:40px}}
.timer-sub{color:var(--muted);font-size:14px}
.clock-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.punches{list-style:none;margin:18px 0 0;padding:14px 0 0;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:6px}
.punches li{display:flex;gap:10px;font-size:13.5px;align-items:center}
.punches .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:72px}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.pdot.in,.pdot.break_end{background:var(--green)} .pdot.break_start{background:var(--amber)} .pdot.out{background:var(--faint)}

/* Checklist */
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.check-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.check-list li:last-child .check-item{border-bottom:0}
.check-item input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--green);flex:none;cursor:pointer}
.check-item .ci-text{flex:1}
.check-item.done .ci-text{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.check-item .ci-time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-checks{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.mini-checks li{display:flex;gap:8px;align-items:baseline}
.mini-checks .mk{width:16px;flex:none;text-align:center;font-weight:700}
.mini-checks li.done .mk{color:var(--green)}
.mini-checks li:not(.done) .mk{color:var(--faint)}
.mini-checks li.done .tx{color:var(--muted)}

/* Numbers */
.num-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.num-row:last-child{border-bottom:0}
.num-row .nm{flex:1;min-width:0;font-weight:550}
.num-row .goal{display:block;font-size:12px;color:var(--muted);font-weight:500}
.num-row .goal.hit{color:var(--green)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;flex:none}
.stepper button{appearance:none;border:0;background:var(--surface-2);width:40px;height:38px;font-size:20px;font-weight:600;cursor:pointer;color:var(--text)}
.stepper button:hover{background:var(--border)}
.stepper button.plus{background:var(--accent-soft);color:var(--accent)}
.stepper input{width:52px;height:38px;border:0;text-align:center;font-weight:700;font-size:16px;background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.num-chip{display:inline-flex;gap:5px;align-items:baseline;padding:3px 9px;border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.num-chip b{color:var(--text);font-size:13.5px;font-variant-numeric:tabular-nums}

/* Tasks */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.select,.input,textarea.input{border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
textarea.input{resize:vertical;width:100%;line-height:1.45}
.input:focus,.select:focus,textarea.input:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.search{position:relative;flex:1 1 220px;max-width:520px}
.search .input{width:100%;padding-left:34px}
.search::before{content:"";position:absolute;left:11px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid var(--faint);border-radius:50%}
.search::after{content:"";position:absolute;left:23px;top:50%;width:6px;height:2px;background:var(--faint);transform:rotate(45deg);margin-top:5px}
.search.big .input{font-size:16px;padding:12px 14px 12px 38px;border-radius:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:120px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:650;font-size:13.5px}
.col-head .n{color:var(--muted);font-weight:600}
.col-body{display:flex;flex-direction:column;gap:8px}
.col-empty{color:var(--faint);font-size:13px;text-align:center;padding:18px 8px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.task:hover{border-color:var(--border-strong)}
.task-top{display:flex;gap:8px;align-items:flex-start}
.prio{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--faint)}
.prio-high{background:var(--red)} .prio-normal{background:var(--accent)} .prio-low{background:var(--border-strong)}
.task-title{font-weight:600;font-size:14px;flex:1;word-break:break-word}
.task.is-done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.task-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.task-actions{display:flex;gap:6px;margin-top:10px}
.my-task{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.my-task:last-child{border-bottom:0}
.my-task input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--green);flex:none;cursor:pointer}
.my-task .mt-body{flex:1;min-width:0;cursor:pointer}
.my-task .mt-title{font-weight:550}
.my-task .mt-next{font-size:13px;color:var(--muted);margin-top:3px}
.rule{display:flex;gap:14px;align-items:flex-start}
.rule + .rule{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.rule .rb{flex:1;min-width:0}
.rule .rt{font-weight:650}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.switch input{width:17px;height:17px;accent-color:var(--green)}

/* Steps editor */
.st-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.st-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex:none}
.st-row .input{flex:1}
.st-row.done .input{color:var(--muted);text-decoration:line-through}
.st-num{width:20px;text-align:right;font-size:12.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}

/* Team */
.member-head{display:flex;align-items:center;gap:12px}
.member-head .nm{font-weight:650;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats.s3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sect{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
details.sect > summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:6px}
details.sect > summary::-webkit-details-marker{display:none}
details.sect > summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:16px;width:10px}
details.sect[open] > summary::before{transform:rotate(90deg)}
.report{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}
.sum-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.sum{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.sum .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sum .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.sum .s{font-size:13px;color:var(--muted);margin-top:2px}

/* Table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.today td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.week-nav{display:flex;gap:6px;align-items:center}
.week-label{font-weight:650;min-width:170px;text-align:center}

/* Playbook & templates */
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.cat-chip{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.cat-chip .c{color:var(--faint);font-weight:500;margin-left:3px}
.cat-chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.cat-chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.pb-list{display:flex;flex-direction:column;gap:10px}
.pb-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.pb-item{appearance:none;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.pb-item:hover{border-color:var(--border-strong)}
.pb-item .t{font-weight:650;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb-item .s{color:var(--muted);font-size:13.5px;margin-top:3px}
.pb-item .snip{font-size:13px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--border)}
.pb-detail .card{padding:22px 24px}
@media (max-width:520px){.pb-detail .card{padding:16px}}
.pb-detail h2.title{font-size:23px;letter-spacing:-.02em;margin:6px 0 4px}
.pb-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.md{font-size:15px;line-height:1.6;margin-top:10px}
.md h2,.md h3,.md h4{margin:22px 0 8px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.md h4{font-size:14.5px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:5px 0}
.md li > ul,.md li > ol{margin:4px 0}
.md .md-table{margin:10px 0;border:1px solid var(--border);border-radius:10px;overflow-x:auto}
.md table{width:100%}
.md th,.md td{white-space:normal;vertical-align:top;font-size:14px;padding:8px 12px}
.md code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:.92em}
.callout{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14.5px}
.fill{background:var(--fill);color:var(--fill-ink);border-radius:5px;padding:1px 6px;font-weight:550;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fill::before{content:"✎ ";font-weight:700}
.ref{appearance:none;display:inline;border:0;border-bottom:1.5px dashed currentColor;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.ref:hover{border-bottom-style:solid}
.ref.missing{color:var(--muted);cursor:help}
.ph{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tpl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl .tt{font-weight:650;font-size:14.5px;word-break:break-word}
.tpl .tb{font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tpl .ta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.preview{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;word-break:break-word;max-height:300px;overflow:auto}

/* Setup */
.tpl-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tpl-row .input{flex:1 1 220px}
.dow{display:inline-flex;gap:3px}
.dow button{appearance:none;width:27px;height:27px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:11.5px;font-weight:650;color:var(--muted);cursor:pointer;padding:0}
.dow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.people-row{display:grid;grid-template-columns:auto minmax(140px,1fr) 150px 110px auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.people-row:last-child{border-bottom:0}
@media (max-width:760px){.people-row{grid-template-columns:auto minmax(0,1fr)}.people-row > .pr-extra{grid-column:2}}
.rate{display:flex;align-items:center;gap:4px}
.rate .input{width:80px}
.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.inline-form{display:flex;gap:8px;margin-top:12px}
.inline-form .input{flex:1}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 12px;align-items:center}
@media (max-width:600px){.kv{grid-template-columns:1fr}}
.kv code{font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.sched-row{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.code-box{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px;word-break:break-all}

/* Quick add */
.quick{max-width:620px;margin:0 auto}
.quick textarea{font-size:18px;min-height:110px}
.due-chips{display:flex;gap:6px;flex-wrap:wrap}

/* Empty */
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:6px}
.empty h3{color:var(--text);font-size:15px;margin-bottom:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px 14px;overflow-y:auto;animation:fade .12s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:580px;padding:20px;animation:rise .15s}
.modal.wide{max-width:860px}
.modal:focus{outline:none}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h2{font-size:18px}
.modal-head .icon-btn{margin-left:auto}
.modal-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.updates{border-top:1px solid var(--border);margin-top:18px;padding-top:14px}
.upd{display:flex;gap:10px;padding:8px 0}
.upd .ub{flex:1;min-width:0}
.upd .uh{font-size:12.5px;color:var(--muted)}
.upd .uh b{color:var(--text);font-weight:600}
.upd .ut{white-space:pre-wrap;font-size:14px;word-break:break-word}
.ev-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:480px){.ev-row{grid-template-columns:1fr auto}.ev-row .input{grid-column:1/2}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 30px);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show.act{pointer-events:auto}
.toast.err{background:var(--red);color:#fff}
.toast-btn{appearance:none;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.skeleton{display:flex;flex-direction:column;gap:14px}
.sk{height:110px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* =========================================================
   Loves Window Washing brand layer
   ========================================================= */
body{font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif}
::selection{background:var(--gold-light);color:var(--ink)}
.app-header{background:color-mix(in srgb,var(--bg) 93%,transparent);border-bottom:2px solid var(--line)}
.hdr{padding-top:12px}
.logo-badge{flex:none;background:var(--cream);border:2px solid var(--ink);padding:2px;line-height:0;box-shadow:3px 3px 0 var(--line)}
.logo-badge > span{display:block;border:1px solid var(--ink);padding:5px 10px}
.logo-badge img{height:50px;width:auto;display:block}
.brand{gap:14px}
.brand h1{font-family:Inter,sans-serif;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 2px}
.brand .sub{font-size:13px;color:var(--muted)}
.tabs{margin-top:12px}
.tab{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:11px 13px;border-bottom-width:3px}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{letter-spacing:0}
.tab .count.hot{background:var(--red);color:#fff}
@media (max-width:520px){.logo-badge img{height:30px}.logo-badge > span{padding:4px 7px}.brand h1{font-size:11px}}

/* Type */
.page-title h2{font-family:var(--font-display);font-weight:400;font-size:32px;letter-spacing:.005em;color:var(--accent);line-height:1.05}
.page-title h2.greet{font-family:var(--font-script);font-size:42px;letter-spacing:0;line-height:1;padding-top:4px}
@media (max-width:520px){.page-title h2{font-size:27px}.page-title h2.greet{font-size:36px}}
.card-head h2,.modal-head h2,.updates h3,.quick h3{font-family:var(--font-display);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.035em;line-height:1.15}
.modal-head h2{font-size:21px}
.member-head .nm{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.01em}
.pb-detail h2.title{font-family:var(--font-display);font-weight:400;font-size:32px;color:var(--accent);letter-spacing:.005em;line-height:1.1}
.md h2,.md h3,.md h4{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.035em;font-size:18px;color:var(--accent)}
.md h4{font-size:16px}
.stat .k,.sum .k,th,.pb-group h3,.col-head,.field > span,.eyebrow{letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.field > span{font-size:11.5px}
.col-head{font-size:12px}
.sum .v,.stat .v{font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
.sum .v{font-size:30px}
.stat .v{font-size:20px}
.big-timer{color:var(--text)}
.empty h3{font-family:var(--font-display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.hero-logo{width:200px;max-width:70%;height:auto;margin:0 auto 10px;display:block}

/* Buttons: pill-shaped like the website */
.btn{border-radius:999px;border-color:var(--border-strong);background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--line)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--line)}
.btn-green{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--line)}
.btn-green:hover{background:var(--accent-hover);filter:none}
.btn-amber{background:var(--gold-light);color:var(--ink);border:1.5px solid var(--line)}
.btn-amber:hover{background:#e6bc72;filter:none}
.btn-danger{border-radius:999px}
.btn-ghost,.btn-ghost:hover{border-color:transparent}
.btn-ghost{background:transparent}
.btn-lg{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:17px;padding:12px 26px}
.btn-lg.btn-green::after,.btn-lg.btn-primary::after{content:"\2192";font-family:Inter,sans-serif;font-size:15px;margin-left:4px;opacity:.85}
.icon-btn{border-radius:999px}
.seg{border-radius:999px;border:1px solid var(--border)}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.cat-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{border-radius:999px;border-color:var(--border-strong)}
.stepper button.plus{background:var(--accent);color:var(--accent-ink)}
.stepper button.plus:hover{background:var(--accent-hover)}
.dow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Cards */
.card{box-shadow:var(--shadow)}
.card.framed{border:2px solid var(--line);box-shadow:5px 5px 0 var(--line)}
.clock-card::before{height:6px}
.clock-card.st-in::before{background:var(--accent)}
.clock-card.st-break::before{background:var(--gold)}
.clock-card.st-out::before{background:var(--border-strong)}
.col{background:var(--surface-2)}
.task,.pb-item,.tpl,.sum{border-color:var(--border)}
.pb-item:hover,.task:hover{border-color:var(--accent)}
.pill-in{background:var(--accent);color:var(--accent-ink)}
.badge-blue{background:var(--ink);color:var(--cream)}
.badge-green{background:var(--green-soft);color:var(--green)}
.prio-normal{background:var(--gold)}
.prio-high{background:var(--red)}
.check-item input,.my-task input,.st-row input[type=checkbox],.switch input{accent-color:var(--accent)}
.progress > span{background:var(--accent)}
.ann{background:var(--accent);color:var(--cream);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line)}
.ann .ann-meta{color:rgba(250,237,210,.72)}
.ann .btn-primary{background:var(--gold-light);color:var(--ink)}
.ann .btn-primary:hover{background:#e6bc72}
.callout{background:var(--surface-2);border-left-color:var(--gold)}
.ref{color:var(--accent)}
.ph{background:var(--accent-soft);color:var(--accent)}
.toast{background:var(--ink);color:var(--cream)}
.av{background:var(--gold-light);color:var(--ink)}
.input:focus,.select:focus,textarea.input:focus{outline-color:color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.quick textarea{background:var(--surface)}
@media (prefers-color-scheme: dark){
  .app-header{border-bottom-color:var(--border-strong)}
  .logo-badge{box-shadow:3px 3px 0 #000}
  .card.framed{box-shadow:5px 5px 0 #000}
  .ann{background:#792c18;color:#faedd2;border-color:var(--line);box-shadow:4px 4px 0 #000}
  .btn-green,.btn-green:hover{border-color:var(--accent)}
  .badge-blue{background:var(--cream);color:var(--ink)}
  .clock-card.st-in::before{background:var(--accent)}
  .btn-amber{border-color:var(--line)}
  .btn-primary,.btn-primary:hover{border-color:var(--accent)}
  .page-title h2,.pb-detail h2.title,.md h2,.md h3,.md h4{color:var(--gold-light)}
  .clock-card.st-out::before{background:var(--gold-light)}
  .progress > span{background:var(--green)}
}

/* Sign-in */
.login-wrap{min-height:62vh;display:grid;place-items:center;padding:24px 0}
.login-card{width:min(420px,100%)}
.login-card .hero-logo{margin-bottom:6px}
.login-card h2.lt{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--accent);margin:4px 0 16px;text-align:center;letter-spacing:.01em}
.login-card .input{width:100%;font-size:16px;padding:11px 12px}
.login-err{color:var(--red);font-weight:650;font-size:14px;margin:0 0 12px}
.login-btn{width:100%;margin-top:4px}
@media (prefers-color-scheme: dark){.login-card h2.lt{color:var(--gold-light)}}

/* Service area map */
:root{--zone-yes:#8f3a1f;--zone-lights:#dba23a;--zone-ask:#f5dcb6;--zone-ask-line:#b8772a;--zone-no:#d9c6a3;--zone-off:#fcf6ea;--zone-edge:#c9b08a;--map-bg:#efe3c8}
@media (prefers-color-scheme: dark){
  :root{--zone-yes:#c65d38;--zone-lights:#c99a35;--zone-ask:#4a3320;--zone-ask-line:#c08637;--zone-no:#3a2c22;--zone-off:#1e1611;--zone-edge:#4f3b2c;--map-bg:#140f0b}
}
.area-grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);grid-template-areas:"look map" "list map";gap:16px;align-items:start}
.area-look{grid-area:look;min-width:0}.area-map{grid-area:map;min-width:0}.area-list{grid-area:list;min-width:0}
@media (max-width:900px){.area-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"look" "map" "list"}}
.map-card{padding:0;overflow:hidden;position:relative}
.map-wrap{position:relative;height:clamp(360px,72vh,780px);background:var(--map-bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
@media (max-width:900px){.map-wrap{height:clamp(320px,60vh,560px)}}
.map-wrap.dragging{cursor:grabbing}
.map-wrap.editing{cursor:crosshair}
.map-wrap > svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.map-msg{color:var(--muted);font-size:14px;text-align:center;padding:20px}
.map-bgrect{fill:var(--map-bg)}
.zp{fill:var(--zone-off);stroke:var(--zone-edge);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.zp.z-yes{fill:var(--zone-yes)} .zp.z-lights{fill:var(--zone-lights)} .zp.z-ask{fill:url(#ask-hatch)} .zp.z-no{fill:var(--zone-no)}
@media (hover:hover){.zp:hover{fill-opacity:.82;stroke:var(--text);stroke-width:1.2}}
.hatch-bg{fill:var(--zone-ask)} .hatch-ln{stroke:var(--zone-ask-line);stroke-width:2.4}
#area-hl{fill:none;stroke:var(--text);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#area-hl-halo{fill:none;stroke:var(--surface);stroke-width:7;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;opacity:.9}
.city-lbl,.zip-lbl{font-family:Inter,system-ui,sans-serif;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.city-lbl{fill:var(--text);font-weight:800;font-size:calc(12.5px / var(--k,1));stroke-width:calc(3.4px / var(--k,1));letter-spacing:.02em}
.city-lbl.minor{display:none;font-weight:700;font-size:calc(11px / var(--k,1))}
.zip-lbl{fill:var(--muted);font-weight:600;font-size:calc(9px / var(--k,1));stroke-width:calc(2.6px / var(--k,1));display:none;font-variant-numeric:tabular-nums}
svg.zoom2 .city-lbl.minor{display:block}
svg.zoom4 .zip-lbl{display:block}
svg.zoom4 .city-lbl{opacity:.55}
.map-ctrl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.map-ctrl button{appearance:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:19px;font-weight:700;cursor:pointer;display:grid;place-items:center;box-shadow:2px 2px 0 var(--line)}
.map-ctrl button:hover{background:var(--surface-2)}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);align-items:center}
.map-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:15px;height:15px;border-radius:4px;border:1px solid var(--zone-edge);flex:none;display:inline-block}
.sw-yes{background:var(--zone-yes)} .sw-lights{background:var(--zone-lights)} .sw-no{background:var(--zone-no)} .sw-off{background:var(--zone-off)}
.sw-ask{background:repeating-linear-gradient(45deg,var(--zone-ask) 0 3px,var(--zone-ask-line) 3px 5px)}
.verdict{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 15px;border:1.5px solid var(--line);margin-top:14px}
.verdict .v-icon{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;margin-top:1px}
.verdict .v-body{flex:1;min-width:0}
.verdict h3{font-family:var(--font-display);font-weight:400;font-size:21px;letter-spacing:.015em;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.verdict p{margin:5px 0 0;font-size:14px}
.v-yes{background:var(--accent-soft)} .v-yes .v-icon{background:var(--zone-yes);color:#fff}
.v-lights{background:color-mix(in srgb,var(--zone-lights) 24%,var(--surface))} .v-lights .v-icon{background:var(--zone-lights);color:#1b1b1b}
.v-ask{background:var(--amber-soft)} .v-ask .v-icon{background:var(--gold);color:#1b1b1b}
.v-no{background:var(--red-soft)} .v-no .v-icon{background:var(--red);color:#fff}
.v-info{background:var(--surface-2)} .v-info .v-icon{background:var(--ink);color:var(--cream)}
.v-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px}
.v-owner{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-strong);display:flex;flex-direction:column;gap:8px}
.v-owner .input{width:100%}
.zone-btns{display:flex;flex-wrap:wrap;gap:5px}
.zone-btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.zone-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zone-btn .sw{width:11px;height:11px;border-radius:3px}
.area-paint{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line)}
.area-paint .edge{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.area-paint .edge .input{width:64px;padding:5px 8px}
.zip-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.zip-chip{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);font-variant-numeric:tabular-nums;display:inline-flex;gap:5px;align-items:center}
.zip-chip:hover{border-color:var(--accent)}
.zip-chip .sw{width:10px;height:10px;border-radius:3px}
.zl-group + .zl-group{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.zl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zl-head b{font-size:14px}
.zl-city{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.zl-cname{font-size:13px;color:var(--muted);font-weight:600;min-width:96px}
.area-hint{margin-top:12px;font-size:13.5px;color:var(--muted)}
.area-hint .zip-chips{margin-top:6px}
</style>
</head>

function md(src) {

/* =========================================================
   Connection to the Loves VA Hub Google Sheet (Apps Script)
   Gives the app the same db/user interface it had on Claude:
   everything is kept in memory, refreshed every 30 seconds,
   and each change is sent to the sheet right away.
   ========================================================= */
const API_URL = ((document.querySelector('meta[name="vahub-connection"]') || {}).content || '').trim();

  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: BE.token }, body || {})), redirect: 'follow' });

    if (out.auth) { signOut(); }
    throw Object.assign(new Error(out.error || 'Something went wrong.'), { code: out.auth ? 'revoked' : (out.code || 'invalid_argument'), userMessage: out.error || '', auth: !!out.auth });

}

      if (Array.isArray(out.users)) BE.users = out.users;

      for (const c of out.changes || []) {

        changed = true;

const subs = {};

      if (err && err.code === 'revoked') { S.revoked = true; render(true); return; }
      if (onErr) onErr(err);
      if (err && err.code === 'unavailable') setTimeout(() => sub(key, ref, onData, onErr), 4000 + Math.random() * 3000);
    });

let toastTimer = null;

  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (action) {
    const b = document.createElement('button'); b.className = 'toast-btn'; b.textContent = action.label;

/* ===== Tasks ===== */
function taskSort(a, b) {
  const pa = PRIO_ORDER[a.priority] ?? 1, pb = PRIO_ORDER[b.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a.due || '9999', db = b.due || '9999';
  if (da !== db) return da < db ? -1 : 1;
  return (a.createdAt || '') < (b.createdAt || '') ? -1 : 1;
}
function taskBadges(t, today) {
  const out = [];
  if (t.status === 'doing') out.push('<span class="badge badge-blue">In progress</span>');
  if (t.priority === 'high' && t.status !== 'done') out.push('<span class="badge badge-red">High</span>');
  if (t.due && t.status !== 'done') {
    const overdue = t.due < today;
    out.push(`<span class="badge ${overdue ? 'badge-red' : t.due === today ? 'badge-amber' : ''}">${overdue ? 'Overdue · ' : 'Due '}${esc(relDue(t.due))}</span>`);
  }
  const st = t.subtasks || [];
  if (st.length) { const d = st.filter(x => x.done).length; out.push(`<span class="badge ${d === st.length ? 'badge-green' : ''}" title="Steps">☑ ${d}/${st.length}</span>`); }
  if (t.recurringId) out.push('<span class="chip" title="Repeating task">↻</span>');
  if (t.sopId) out.push('<span class="chip" title="Has a playbook page">📘</span>');
  const nUpd = (t.updates || []).length;
  if (nUpd) out.push(`<span class="chip" title="Updates">💬 ${nUpd}</span>`);
  return out.join('');
}

/* ===== Repeating tasks ===== */
function recurMatches(r, k) {
  const wd = weekdayOfKey(k);
  switch (r.freq) {
    case 'daily': return true;
    case 'weekdays': return wd >= 1 && wd <= 5;
    case 'weekly': return (r.days || []).includes(wd);
    case 'monthly': {
      const day = +k.slice(8, 10); const [y, m] = k.split('-').map(Number);
      const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const want = r.dom === 'last' ? last : Math.min(+r.dom || 1, last);
      return day === want;
    }
    default: return false;
  }
}
function freqLabel(r) {
  switch (r.freq) {
    case 'daily': return 'Every day';
    case 'weekdays': return 'Every weekday (Mon–Fri)';
    case 'weekly': return 'Every week on ' + ((r.days || []).length ? r.days.slice().sort().map(d => WD_SHORT[d]).join(', ') : '—');
    case 'monthly': return 'Every month on the ' + (r.dom === 'last' ? 'last day' : ordinal(+r.dom || 1));
    default: return '—';
  }
}
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function nextOccurrence(r) {
  const tz = r.assignee ? tzOf(r.assignee) : LOCAL_TZ;
  let k = dateKey(new Date(), tz);
  const startK = r.lastRun && r.lastRun >= k ? addDays(k, 1) : k;
  for (let i = 0, d = startK; i < 400; i++, d = addDays(d, 1)) { if ((!r.startDate || d >= r.startDate) && recurMatches(r, d)) return d; }
  return null;
}
function viewRepeating() {
  const list = S.recurring.slice().sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  const body = list.length ? list.map(r => { const nx = nextOccurrence(r); return `<div class="rule">
      <div class="rb"><div class="rt">↻ ${esc(r.title)}</div>
        <div class="task-meta">${esc(freqLabel(r))} · ${esc(nameOf(r.assignee))}${(r.subtasks || []).length ? ` · ${plural(r.subtasks.length, 'step')}` : ''}${r.priority === 'high' ? ' · <span class="badge badge-red">High</span>' : ''}</div>
        <div class="muted small" style="margin-top:4px">${r.active ? (nx ? `Next: ${esc(fmtKey(nx))}` : '') : 'Paused'}${r.dueOffset ? ` · due ${r.dueOffset === 1 ? 'next day' : `${r.dueOffset} days later`}` : ''}</div></div>

    </div>`; }).join('')

  return `<div class="toolbar"><button class="btn btn-primary" data-action="new-rec">+ New repeating task</button><span class="muted small">Each one creates a fresh task on its day, with its steps reset.</span></div>
    <section class="card">${body}</section>`;
}

/* ===== Hours & pay ===== */
function weekData(uid, start) {
  const end = addDays(start, 6);
  const live = S.days[uid] || {};
  const keys = Object.keys(live).sort();
  const complete = (S.daysSize[uid] || 0) < DAYS_LIMIT;
  // Days older than about 4 months stay in the sheet until someone opens that week.
  const old = start < addDays(dateKey(new Date()), -110);
  if (!old && (complete || (keys.length && start >= keys[0]))) return { data: live, loading: false };
  const key = uid + '|' + start;
  if (S.archive[key]) return { data: S.archive[key], loading: false };
  fetchArchive(uid, start, end, key);
  return { data: {}, loading: true };
}
async function fetchArchive(uid, start, end, key) {
  if (S.archivePending[key]) return;
  S.archivePending[key] = true;
  try {
    const snap = await S.db.collection(`time/${uid}/days`).where('date', '>=', start).where('date', '<=', end).get();
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    S.archive[key] = m;
  } catch (e) { S.archive[key] = {}; handleErr(e); }
  delete S.archivePending[key];
  render();
}
function weekRows(uid, start) {
  const { data, loading } = weekData(uid, start);
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const k = addDays(start, i);
    const d = data[k];
    const live = liveFor(uid, k);
    const st = dayStats(d && d.events);
    const tot = liveTotals(st, live);
    rows.push({ k, d, st, tot, live, li: lateInfo(uid, k, st), missingOut: !live && st.state !== 'out' && st.events.length > 0 });
  }
  return { rows, loading };
}

  const thisWeek = mondayOf(dateKey(new Date()));

  const sumCard = (k, ms, extra) => `<div class="sum"><div class="k">${k}</div><div class="v">${rate ? extra : fmtDur(ms)}</div><div class="s">${rate ? fmtDur(ms) + ' worked' : 'worked'}</div></div>`;

  return `<div class="page-title"><h2>${S.isOwner ? 'Hours & pay' : 'My hours'}</h2>${personSel}</div>

function timesheetTSV() {
  const uid = S.hUid; const tz = S.hTzMode === 'member' ? tzOf(uid) : LOCAL_TZ; const rate = rateOf(uid);

async function punch(type, atISO, extra) {
  if (!canWrite() || S.busy) return;
  const clock = personClock(S.uid);
  const today = dateKey(new Date());
  if (type === 'in' && clock.status !== 'out') { toast("You're already clocked in."); return; }
  if (type === 'break_start' && clock.status !== 'in') return;
  if (type === 'break_end' && clock.status !== 'break') return;
  if (type === 'out' && clock.status === 'out') return;
  const day = type === 'in' ? today : (clock.day || today);
  const at = atISO || new Date().toISOString();
  S.busy = true; render(true);
  try {
    await writeDoc(`time/${S.uid}/days/${day}`, cur => {
      const d = cur || { date: day, events: [] };
      d.date = day; d.tz = LOCAL_TZ;
      d.events = (d.events || []).concat([Object.assign({ type, at }, extra || {})]);
      d.updatedAt = new Date().toISOString();
      return d;
    });
    toast({ in: 'Clocked in. Have a great day!', break_start: 'Break started', break_end: 'Welcome back', out: 'Clocked out' }[type]);
  } catch (e) { handleErr(e); }
  finally { S.busy = false; render(true); }
}

    return txt;

async function runRecurring() {

      if (!r.active || !r.title) continue;

  sub('templates', db.collection('templates'), snap => {
    S.templates = snap.docs.filter(d => d.exists).map(d => indexDoc(Object.assign({ id: d.id }, d.data()), { plain: (d.data().subject || '') + ' ' + (d.data().body || '') }));
    if (S.tab === 'templates' && isEditing(document.activeElement)) { const r = $('#tpl-results'); if (r) r.innerHTML = tplResultsHTML(); }
    render();
  });
  sub('sops', db.collection('sops'), snap => {
    S.sops = snap.docs.filter(d => d.exists).map(d => indexDoc(Object.assign({ id: d.id }, d.data()), { plain: plainText(d.data().body) }));
    render();
  });
  sub('announcements', db.collection('announcements'), snap => { S.announcements = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render(); });
  sub('recurring', db.collection('recurring'), snap => { S.recurring = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render(); if (!snap.metadata || !snap.metadata.fromCache) setTimeout(runRecurring, 1500); });
  sub('seen', db.collection('seen'), snap => { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); S.seen = m; render(); });
  ensurePersonSubs(S.uid);
}
setInterval(runRecurring, 15 * 60000);
async function registerSelf() {
  const ref = S.db.doc('people/' + S.uid);
  try {
    const snap = await ref.get();
    const role = S.isOwner ? 'manager' : 'va';
    if (!snap.exists) await ref.set({ role, tz: LOCAL_TZ, joinedAt: new Date().toISOString(), nickname: '', hidden: false });
    else { const d = snap.data() || {}; const fix = {}; if (d.tz !== LOCAL_TZ) fix.tz = LOCAL_TZ; if (d.role !== role) fix.role = role; if (Object.keys(fix).length) await ref.update(fix); }
  } catch (e) {
    if (e && e.code === 'invalid_argument') { S.readOnly = true; render(true); }
    else console.warn('[VA Hub] register failed', e);
  }
}
async function init() {
  render(true);
  if (!apiConfigured()) { S.phase = 'setup'; render(true); return; }
  BE.token = lsGet(TOKEN_KEY);
  try { BE.me = JSON.parse(lsGet(ME_KEY) || 'null'); } catch (e) { BE.me = null; }
  if (!BE.token || !BE.me || !BE.me.id) await waitForLogin();
  await connect();
}
async function connect() {
  S.phase = 'loading'; render(true);
  const slowTimer = setTimeout(() => { S.slow = true; render(true); }, 10000);
  try { await beSync(true); }
  catch (e) { clearTimeout(slowTimer); if (e && e.auth) return; S.slow = false; S.phase = 'offline'; render(true); return; }
  clearTimeout(slowTimer); S.slow = false;
  S.claude = { use: async n => n === 'db' ? beDb : n === 'user' ? beUser : null };
  S.db = beDb; S.user = beUser;
  S.me = await beUser.me();
  S.uid = S.me.id;
  S.isOwner = !!S.me.isOwner;
  S.tab = validTab(location.hash.slice(1)) || (S.isOwner ? 'team' : 'myday');
  startSubs();
  registerSelf();
  startPolling();
  render(true);
}
init();
})();
</script>
